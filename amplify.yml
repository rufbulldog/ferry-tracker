version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Building Ferry Tracker App"
        - npm ci --legacy-peer-deps
    build:
      commands:
        - echo "AWS_BRANCH is $AWS_BRANCH"
        - |
          if echo "$AWS_BRANCH" | grep -qi "dev"; then
            echo "Building for DEV (branch contains 'dev')"
            EXPO_PUBLIC_APP_ENV=dev npx expo export --platform web
          else
            echo "Building for PROD"
            EXPO_PUBLIC_APP_ENV=prod npx expo export --platform web
          fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
